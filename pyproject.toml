[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator for the 42 AMAZEING project"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["mazegen"]

[tool.mypy]
exclude = ["\\.venv", "output_validator\\.py"]
